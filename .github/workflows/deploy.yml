# Em pull request: só os testes (sem segredos, sem imagem, sem deploy).
# A cada push na master:
#  1. test    — gofmt, vet, testes e sintaxe do JS.
#  2. version — versão nova (vX.Y.Z) pelas etiquetas do PR que entrou: "breaking"
#               sobe a maior, "enhancement" a menor, qualquer outra a correção
#               (scripts/next-version.sh). Cria a tag e a Release com o resumo do
#               PR. Commit que já tem versão (re-execução) reaproveita a dele.
#  3. image   — publica a imagem multi-arquitetura (arm64 + amd64) em
#               ghcr.io/<dono>/vpserver-monitoring (:latest, :<versão> e :<commit>).
#               É o que quem instala pelo `vpmon init` baixa.
#  4. deploy  — (opcional) sobe a versão num servidor por SSH com chave restrita,
#               só se a variável VPSERVER_DEPLOY for "true" no repositório.
#
# Deploy por SSH: a chave do segredo VPSERVER_SSH_KEY SÓ consegue rodar
# /opt/vpserver-monitoring/bin/receive no servidor (authorized_keys com
# command= e restrict); o receive só mexe no projeto Compose "vpserver-monitoring".
# Segredos: VPSERVER_SSH_KEY, VPSERVER_KNOWN_HOSTS, VPSERVER_HOST e VPSERVER_URL
# (opcional, para conferir o /healthz depois). Endereço e IP ficam em segredo de
# propósito: o GitHub os esconde nos logs, que são públicos em repositório público.
# Variável: VPSERVER_DEPLOY=true liga o deploy.
name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # PRs não esperam na fila do deploy (e um push novo no PR cancela o teste velho)
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # sem dependências externas (não há go.sum)
      - name: OpenSSH (teste de ponta a ponta do SSH pela tela)
        run: test -x /usr/sbin/sshd || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends openssh-server; }
      - name: Testes
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "rode gofmt -w ."; exit 1; }
          go vet ./...
          go test ./...
          node --check internal/web/static/app.js

  version:
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag e Release
      pull-requests: read # etiquetas do PR
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      built: ${{ steps.v.outputs.built }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA::7}"
          built=$(git log -1 --format=%cI "$GITHUB_SHA")
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            version="${existing#v}"
            echo "o commit já tem a versão $existing"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            labels=""
            title=$(git log -1 --format=%s "$GITHUB_SHA")
            body=$(git log -1 --format=%b "$GITHUB_SHA")
            if [ -n "$pr" ]; then
              labels=$(gh pr view "$pr" --json labels --jq '.labels[].name' | tr '\n' ' ')
              title=$(gh pr view "$pr" --json title --jq .title)
              # o "## Resumo" do PR vira o texto da Release
              body=$(gh pr view "$pr" --json body --jq .body | tr -d '\r' | awk '/^## /{on=($0 ~ /^## Resumo/); next} on')
            fi
            version=$(sh scripts/next-version.sh "$last" $labels)
            {
              printf '%s\n\n' "$body"
              if [ -n "$pr" ]; then printf -- '- PR: #%s\n' "$pr"; fi
              printf -- '- Commit: %s\n' "$GITHUB_SHA"
              if [ -n "$last" ]; then
                printf -- '- Mudanças desde %s: %s/%s/compare/%s...v%s\n' "$last" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$last" "$version"
              fi
            } > notes.md
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version · $title" --notes-file notes.md
            echo "versão nova: v$version (antes: ${last:-nenhuma}; etiquetas: ${labels:-nenhuma})"
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "built=$built"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: [test, version]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ needs.version.outputs.commit }}
            BUILT=${{ needs.version.outputs.built }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # guarda a latest e as 10 versões mais novas (entende imagem multiplataforma:
      # manter uma versão mantém as peças dela); não derruba o CI se falhar
      - name: Limpar versões antigas da imagem
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true

  deploy:
    needs: [test, version]
    if: ${{ github.event_name != 'pull_request' && vars.VPSERVER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: ${{ secrets.VPSERVER_URL }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
      BUILT: ${{ needs.version.outputs.built }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Compilar (linux/arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.built=$BUILT" -o dist/vpmon ./cmd/vpmon
          echo "$VERSION" > dist/VERSION
          cp -r deploy dist/deploy
          tar -czf release.tgz -C dist .
          ls -la release.tgz
      - name: Subir no servidor
        env:
          SSH_KEY: ${{ secrets.VPSERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPSERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPSERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "ubuntu@$HOST" < release.tgz
      - name: Conferir no ar
        if: ${{ env.URL != '' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$URL/healthz"; then echo; exit 0; fi
            sleep 5
          done
          echo "$URL não respondeu"; exit 1
